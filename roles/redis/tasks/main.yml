---
- name: Install Redis
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true

- name: Deploy Redis password file
  ansible.builtin.template:
    src: redis-auth.conf.j2
    dest: /etc/redis/redis-auth.conf
    owner: redis
    group: redis
    mode: '0640'
  no_log: true
  notify: Restart redis

- name: Deploy Redis configuration
  ansible.builtin.copy:
    src: redis.conf
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: '0640'
  notify: Restart redis

- name: Enable and start Redis
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started

- name: Allow the poll client to reach Redis
  community.general.ufw:
    rule: allow
    port: '{{ redis_port }}'
    proto: tcp
    from_ip: "{{ poll_host }}"

- name: Allow the worker to reach Redis
  community.general.ufw:
    rule: allow
    port: '{{ redis_port }}'
    proto: tcp
    from_ip: "{{ worker_host }}"
