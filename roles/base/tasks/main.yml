---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install useful packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - curl
      - vim
      - less
      - tar
      - rsync
      - net-tools
      - ufw
    state: present

- name: Set Timezone
  community.general.timezone:
    name: "{{ timezone | default('Europe/Paris') }}"

- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Enable the firewall with a default-deny policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
