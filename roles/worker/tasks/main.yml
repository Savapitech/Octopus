---
- name: Create worker service user
  ansible.builtin.user:
    name: worker
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Java 21 and Maven
  ansible.builtin.apt:
    name:
      - openjdk-21-jdk-headless
      - maven
    state: present
    update_cache: true
  become: true

- name: Copy worker.tar to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/worker.tar"
    dest: /opt/worker.tar
    mode: '0644'
  become: true
  register: worker_tar

- name: Extract worker application
  ansible.builtin.unarchive:
    src: /opt/worker.tar
    dest: /opt/
    remote_src: true
  become: true
  when: worker_tar.changed
  register: worker_extract
  notify: Restart worker

- name: Build worker with Maven
  ansible.builtin.command:
    cmd: mvn package -DskipTests --no-transfer-progress
    chdir: /opt/worker
  become: true
  when: worker_extract.changed | default(false)
  notify: Restart worker

- name: Create worker environment file
  ansible.builtin.copy:
    dest: /etc/worker.env
    owner: worker
    group: worker
    mode: '0640'
    content: |
      REDIS_HOST={{ redis_host }}
      REDIS_PORT={{ redis_port }}
      REDIS_PASSWORD={{ redis_password }}
      POSTGRES_HOST={{ postgres_host }}
      POSTGRES_PORT={{ postgres_port }}
      POSTGRES_DB={{ postgres_db }}
      POSTGRES_USER={{ postgres_user }}
      POSTGRES_PASSWORD={{ postgresql_password }}
  become: true
  no_log: true
  notify: Restart worker

- name: Deploy worker systemd service
  ansible.builtin.copy:
    src: worker.service
    dest: /etc/systemd/system/worker.service
    mode: '0644'
  become: true
  notify: Restart worker

- name: Enable and start worker service
  ansible.builtin.systemd:
    name: worker
    enabled: true
    state: started
    daemon_reload: true
  become: true
