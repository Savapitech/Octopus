---
- name: Create result service user
  ansible.builtin.user:
    name: result
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    mode: '0644'
  become: true

- name: Add NodeSource apt repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: https://deb.nodesource.com/node_20.x
    suites: nodistro
    components: main
    signed_by: /usr/share/keyrings/nodesource.asc
    state: present
  become: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true

- name: Copy result.tar to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/result.tar"
    dest: /opt/result.tar
    mode: '0644'
  become: true

- name: Extract result application
  ansible.builtin.unarchive:
    src: /opt/result.tar
    dest: /opt/
    remote_src: true
    creates: /opt/result
  become: true
  notify: Restart result

- name: Install result Node.js dependencies
  community.general.npm:
    path: /opt/result
    production: true
  become: true
  notify: Restart result

- name: Create result environment file
  ansible.builtin.copy:
    dest: /etc/result.env
    owner: result
    group: result
    mode: '0640'
    content: |
      POSTGRES_HOST={{ postgres_host }}
      POSTGRES_PORT={{ postgres_port }}
      POSTGRES_DB={{ postgres_db }}
      POSTGRES_USER={{ postgres_user }}
      POSTGRES_PASSWORD={{ postgresql_password }}
  become: true
  no_log: true
  notify: Restart result

- name: Deploy result systemd service
  ansible.builtin.copy:
    src: result.service
    dest: /etc/systemd/system/result.service
    mode: '0644'
  become: true
  notify: Restart result

- name: Allow public access to the result client
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  become: true

- name: Enable and start result service
  ansible.builtin.systemd:
    name: result
    enabled: true
    state: started
    daemon_reload: true
  become: true
