---
- name: Add PostgreSQL GPG key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/postgresql.asc
    mode: '0644'
  become: true

- name: Add PostgreSQL apt repository
  ansible.builtin.deb822_repository:
    name: postgresql
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: /usr/share/keyrings/postgresql.asc
    state: present
  become: true

- name: Install PostgreSQL 16
  ansible.builtin.apt:
    name:
      - postgresql-16
      - python3-psycopg2
    state: present
    update_cache: true
  become: true

- name: Enable and start PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
  become: true

- name: Deploy pg_hba.conf
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: /etc/postgresql/16/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'
  become: true
  notify: Restart postgresql

- name: Configure PostgreSQL to listen on all interfaces
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
  become: true
  notify: Restart postgresql

- name: Apply the PostgreSQL configuration now
  ansible.builtin.meta: flush_handlers

- name: Create the paul database user with limited permissions
  community.postgresql.postgresql_user:
    name: "{{ postgres_user }}"
    password: "md5{{ (postgresql_password + postgres_user) | hash('md5') }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
  become: true
  become_user: postgres
  no_log: true

- name: Create the paul database owned by paul
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    owner: "{{ postgres_user }}"
  become: true
  become_user: postgres

- name: Check whether the votes table already exists
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgresql_password }}"
    login_db: "{{ postgres_db }}"
    query: SELECT to_regclass('public.votes') AS reg
  register: postgresql_votes_table
  no_log: true

- name: Create the votes table from schema.sql
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgresql_password }}"
    login_db: "{{ postgres_db }}"
    query: "{{ lookup('ansible.builtin.file', 'schema.sql') }}"
  no_log: true
  when: postgresql_votes_table.query_result[0].reg is none

- name: Allow the worker to reach PostgreSQL
  community.general.ufw:
    rule: allow
    port: '{{ postgres_port }}'
    proto: tcp
    from_ip: "{{ worker_host }}"
  become: true

- name: Allow the result client to reach PostgreSQL
  community.general.ufw:
    rule: allow
    port: '{{ postgres_port }}'
    proto: tcp
    from_ip: "{{ result_host }}"
  become: true
