---
- name: Create poll service user
  ansible.builtin.user:
    name: poll
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Python venv support
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
      - python3-packaging
    state: present
    update_cache: true
  become: true

- name: Copy poll.tar to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/poll.tar"
    dest: /opt/poll.tar
    mode: '0644'
  become: true
  register: poll_tar

- name: Extract poll application
  ansible.builtin.unarchive:
    src: /opt/poll.tar
    dest: /opt/
    remote_src: true
  become: true
  when: poll_tar.changed
  notify: Restart poll

- name: Install poll application dependencies
  ansible.builtin.pip:
    requirements: /opt/poll/requirements.txt
    virtualenv: /opt/poll/venv
    virtualenv_command: python3 -m venv
  become: true
  notify: Restart poll

- name: Install gunicorn for poll
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: /opt/poll/venv
    virtualenv_command: python3 -m venv
  become: true
  notify: Restart poll

- name: Create poll environment file
  ansible.builtin.copy:
    dest: /etc/poll.env
    owner: poll
    group: poll
    mode: '0640'
    content: |
      REDIS_HOST={{ redis_host }}
      REDIS_PORT={{ redis_port }}
      REDIS_PASSWORD={{ redis_password }}
  become: true
  no_log: true
  notify: Restart poll

- name: Deploy poll systemd service
  ansible.builtin.copy:
    src: poll.service
    dest: /etc/systemd/system/poll.service
    mode: '0644'
  become: true
  notify: Restart poll

- name: Allow public access to the poll client
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  become: true

- name: Enable and start poll service
  ansible.builtin.systemd:
    name: poll
    enabled: true
    state: started
    daemon_reload: true
  become: true
